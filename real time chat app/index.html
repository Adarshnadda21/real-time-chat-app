<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Time Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">

        <div class="login-box">

            <h1>💬 Real Time Chat</h1>

            <p>Enter your username to join</p>

            <input
                type="text"
                id="usernameInput"
                placeholder="Enter username"
                maxlength="20"
            >

            <button id="joinButton">
                Join Chat
            </button>

        </div>

    </div>


    <!-- Chat Screen -->
    <div id="chatScreen" class="chat-container hidden">

        <!-- Header -->
        <header class="chat-header">

            <div>
                <h2>💬 Chat Room</h2>

                <span id="onlineUsers">
                    0 users online
                </span>
            </div>

            <div class="status">
                ● Online
            </div>

        </header>


        <!-- Messages -->
        <main id="messages" class="messages">

        </main>


        <!-- Typing indicator -->
        <div id="typingIndicator" class="typing">

        </div>


        <!-- Message Input -->
        <form id="messageForm" class="message-form">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>


    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Application JS -->
    <script src="script.js"></script>

</body>

</html>
